<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <!-- Purple Brand Gradients -->
    <linearGradient id="cineora-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6444e4"/>
      <stop offset="100%" stop-color="#231268"/>
    </linearGradient>
    
    <linearGradient id="cineora-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eae5ff"/>
      <stop offset="100%" stop-color="#6444e4"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="cineora-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ICON MONOGRAM: Stylized "C" Film Reel & Ticket Aperture -->
  <g transform="translate(10, 10)">
    <!-- Outer Glow Circle Ring (C-Shape) -->
    <path d="M 46 6 
             A 28 28 0 1 0 46 54" 
          stroke="url(#cineora-grad-primary)" 
          stroke-width="8" 
          stroke-linecap="round" 
          fill="none" 
          filter="url(#cineora-glow)" />

    <!-- Inner Ticket Notch Ring Accent -->
    <path d="M 40 16 
             A 18 18 0 1 0 40 44" 
          stroke="url(#cineora-grad-accent)" 
          stroke-width="4" 
          stroke-dasharray="8 3" 
          stroke-linecap="round" 
          fill="none" />

    <!-- Center Play / Cinema Spark Triangle -->
    <path d="M 27 23 L 39 30 L 27 37 Z" 
          fill="url(#cineora-grad-accent)" />
          
    <!-- Small Cinema Reel Aperture Dots -->
    <circle cx="16" cy="30" r="2.5" fill="#ffffff" />
    <circle cx="46" cy="18" r="2" fill="#6444e4" />
    <circle cx="46" cy="42" r="2" fill="#6444e4" />
  </g>

  <!-- TYPOGRAPHY: CINEORA -->
  <text x="80" y="52" 
        font-family="'Be Vietnam Pro', 'Inter', system-ui, sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="1.5" 
        fill="#000000">
    CINEORA
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="82" y="66" 
        font-family="'Be Vietnam Pro', 'Inter', system-ui, sans-serif" 
        font-size="10" 
        font-weight="600" 
        letter-spacing="3" 
        fill="#545459">
    CINEMA &amp; TICKETS
  </text>
</svg>
