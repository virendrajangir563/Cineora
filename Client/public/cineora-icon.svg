<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60" fill="none">
  <defs>
    <linearGradient id="cineora-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6444e4"/>
      <stop offset="100%" stop-color="#231268"/>
    </linearGradient>
    
    <linearGradient id="cineora-icon-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eae5ff"/>
      <stop offset="100%" stop-color="#6444e4"/>
    </linearGradient>

    <filter id="cineora-icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Glow Circle C-Shape -->
  <path d="M 46 6 
           A 24 24 0 1 0 46 54" 
        stroke="url(#cineora-icon-grad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        fill="none" 
        filter="url(#cineora-icon-glow)" />

  <!-- Inner Dashed Accent Notch Ring -->
  <path d="M 40 14 
           A 16 16 0 1 0 40 46" 
        stroke="url(#cineora-icon-accent)" 
        stroke-width="3.5" 
        stroke-dasharray="7 3" 
        stroke-linecap="round" 
        fill="none" />

  <!-- Play Center Play Triangle -->
  <path d="M 26 22 L 38 30 L 26 38 Z" 
        fill="url(#cineora-icon-accent)" />

  <!-- Aperture Accent Dots -->
  <circle cx="15" cy="30" r="2.5" fill="#ffffff" />
  <circle cx="46" cy="18" r="2" fill="#6444e4" />
  <circle cx="46" cy="42" r="2" fill="#6444e4" />
</svg>
